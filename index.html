<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
 --white:#fff;--black:#050505;--glass:rgba(255,255,255,.055);
 --glass2:rgba(255,255,255,.10);--line:rgba(255,255,255,.18);
 --muted:rgba(255,255,255,.56);--shadow:0 25px 70px rgba(0,0,0,.65)
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:Inter,Arial,sans-serif}
body{background:#050505;color:#fff;display:flex;justify-content:center;align-items:center;overflow-x:hidden}
#bgVideo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-8;filter:grayscale(1) brightness(.34) contrast(1.15)}
.bg{position:fixed;inset:0;z-index:-7;background:
 radial-gradient(circle at 50% 10%,rgba(255,255,255,.10),transparent 32%),
 radial-gradient(circle at 10% 90%,rgba(255,255,255,.055),transparent 35%),
 linear-gradient(135deg,rgba(0,0,0,.2),rgba(0,0,0,.78))}
.blobs{position:fixed;inset:0;overflow:hidden;z-index:-6;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(90px);background:#fff;opacity:.07;animation:float 18s ease-in-out infinite alternate}
.blob.a{width:300px;height:300px;left:-100px;top:5%}
.blob.b{width:260px;height:260px;right:-80px;top:38%;animation-duration:22s}
.blob.c{width:350px;height:350px;left:35%;bottom:-180px;animation-duration:20s}
@keyframes float{to{transform:translate(50px,-35px) scale(1.12)}}

.cursor{position:fixed;width:190px;height:190px;border-radius:50%;pointer-events:none;z-index:20;
 transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,255,255,.14),transparent 68%);
 filter:blur(5px)}
.top{position:fixed;top:15px;right:15px;z-index:5}
.theme{width:40px;height:40px;border:1px solid var(--line);border-radius:13px;background:var(--glass);
 color:#fff;cursor:pointer;backdrop-filter:blur(18px);font-size:16px;transition:.3s}
.theme:hover{background:var(--glass2);transform:translateY(-2px)}

.wrap{width:min(91vw,390px);padding:20px 0 28px;perspective:1000px;transform:translateY(135px)}
.card{position:relative;padding:24px 17px 17px;border:1px solid var(--line);border-radius:22px;
 background:var(--glass);backdrop-filter:blur(20px) saturate(.8);-webkit-backdrop-filter:blur(20px) saturate(.8);
 box-shadow:var(--shadow);transform-style:preserve-3d;will-change:transform;overflow:hidden}
.card:before{content:"";position:absolute;inset:0;border-radius:22px;pointer-events:none;
 background:linear-gradient(135deg,rgba(255,255,255,.13),transparent 38%,rgba(255,255,255,.035) 75%,transparent)}

.views{position:absolute;top:12px;left:12px;padding:5px 8px;border:1px solid rgba(255,255,255,.13);
 border-radius:999px;background:rgba(0,0,0,.2);color:var(--muted);font-size:9px;backdrop-filter:blur(12px)}
.profile{text-align:center;position:relative;z-index:1}
.avatar{width:105px;height:105px;margin:5px auto 14px;padding:3px;border-radius:50%;
 background:conic-gradient(#fff,#555,#fff,#111,#fff);animation:spin 7s linear infinite;
 box-shadow:0 0 30px rgba(255,255,255,.16);transform:translateZ(30px)}
.avatar img{width:100%;height:100%;display:block;border-radius:50%;object-fit:cover;
 border:3px solid #090909;filter:grayscale(1)}
@keyframes spin{to{filter:hue-rotate(360deg)}}
.name{font-size:27px;font-weight:800;letter-spacing:-1px;transform:translateZ(20px)}
.handle{font-size:11px;color:var(--muted);margin-top:4px;transform:translateZ(15px)}
.status{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:6px 10px;border:1px solid rgba(255,255,255,.13);
 border-radius:999px;color:var(--muted);font-size:10px;background:rgba(255,255,255,.035)}
.status i{width:6px;height:6px;border-radius:50%;background:#777;box-shadow:0 0 7px rgba(255,255,255,.25)}
@keyframes pulse{50%{opacity:.35;transform:scale(.7)}}

.bio-label{display:flex;align-items:center;justify-content:center;gap:9px;margin:17px 0 0;
 color:rgba(255,255,255,.48);font-size:8px;font-weight:700;letter-spacing:3px}
.bio-label span{width:38px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22))}
.bio-label span:last-child{background:linear-gradient(90deg,rgba(255,255,255,.22),transparent)}
.links{display:grid;gap:8px;margin-top:11px;position:relative;z-index:2}
.link{height:50px;display:flex;align-items:center;gap:10px;padding:7px 10px;
 color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.15);border-radius:15px;
 background:rgba(255,255,255,.045);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
 transition:transform .35s cubic-bezier(.22,1,.36,1),background .3s,box-shadow .3s,border-color .3s;
 box-shadow:0 7px 22px rgba(0,0,0,.25)}
.link:hover{transform:translateY(-3px) scale(1.012);background:rgba(255,255,255,.09);
 border-color:rgba(255,255,255,.32);box-shadow:0 12px 32px rgba(0,0,0,.38),0 0 20px rgba(255,255,255,.07)}
.link:active{transform:scale(.98)}
.icon{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;
 border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.07);font-size:14px;font-weight:800}
.txt{display:flex;flex-direction:column;gap:1px;min-width:0}.title{font-size:12px;font-weight:700}.sub{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrow{margin-left:auto;color:var(--muted);font-size:17px;transition:.3s}.link:hover .arrow{transform:translateX(3px);color:#fff}

.socials{display:flex;justify-content:center;gap:8px;margin:14px 0 10px}
.social{width:36px;height:36px;border:1px solid rgba(255,255,255,.15);border-radius:12px;background:rgba(255,255,255,.05);
 color:#fff;text-decoration:none;display:grid;place-items:center;font-size:12px;font-weight:700;transition:.3s}
.social:hover{transform:translateY(-3px);background:rgba(255,255,255,.11);box-shadow:0 0 18px rgba(255,255,255,.09)}
.footer{text-align:center;font-size:8px;color:rgba(255,255,255,.38);letter-spacing:.2px}

.music{position:fixed;right:14px;bottom:14px;width:205px;height:50px;padding:7px 9px;
 border:1px solid var(--line);border-radius:15px;background:var(--glass);backdrop-filter:blur(20px);
 box-shadow:0 14px 38px rgba(0,0,0,.45);z-index:8;display:flex;align-items:center;gap:8px}
.note{width:31px;height:31px;border-radius:10px;display:grid;place-items:center;background:#111;border:1px solid #333;font-size:14px}
.track{min-width:0;flex:1}.track b{display:block;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track small{font-size:7px;color:var(--muted)}
.play{width:29px;height:29px;border-radius:50%;border:1px solid #555;background:#111;color:#fff;cursor:pointer;font-size:10px}
.progress{position:absolute;left:9px;right:9px;bottom:4px;height:2px;background:#222;border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;width:0;background:#fff}

.enter{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(0,0,0,.72);
 backdrop-filter:blur(24px);transition:opacity .8s,visibility .8s}
.enter.hidden{opacity:0;visibility:hidden;pointer-events:none}
.enter-btn{border:1px solid rgba(255,255,255,.30);border-radius:999px;padding:18px 38px;
 background:rgba(255,255,255,.09);color:#fff;font-size:17px;font-weight:700;cursor:pointer;
 box-shadow:0 0 28px rgba(255,255,255,.10);animation:enterPulse 1.8s infinite;transition:.3s}
.enter-btn:hover{background:rgba(255,255,255,.14);transform:scale(1.035)}
@keyframes enterPulse{50%{box-shadow:0 0 48px rgba(255,255,255,.25)}}

@media(max-width:600px){
 .wrap{width:min(93vw,390px);padding-bottom:85px;transform:translateY(75px)}.card{padding:22px 14px 14px}
 .avatar{width:96px;height:96px}.name{font-size:24px}
 .music{left:9px;right:9px;bottom:9px;width:auto}
 .cursor{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<video id="bgVideo" autoplay muted loop playsinline><source src="background.mp4" type="video/mp4"></video>
<div class="bg"></div><div class="blobs"><i class="blob a"></i><i class="blob b"></i><i class="blob c"></i></div>
<div class="cursor" id="cursor"></div>

<div class="top"><button class="theme" id="theme" aria-label="Тема">☼</button></div>

<div class="enter" id="enter">
  <button class="enter-btn" id="enterBtn" type="button">нажми, чтобы войти ✦</button>
</div>

<main class="wrap">
<section class="card" id="card">
  <div class="views">∞ <span id="views">∞</span></div>
  <div class="profile">
    <div class="avatar"><img src="avatar.gif" alt="avatar"></div>
    <div class="name">msg xyzik</div>
    <div class="handle">@msg_xyzik</div>
    <div class="status"><i></i> offline</div>
  </div>

  <div class="bio-label"><span></span>BIO<span></span></div>

  <div class="links">
    <a class="link" href="https://t.me/msg_xyz_bio" target="_blank" rel="noopener">
      <span class="icon">✈</span><span class="txt"><b class="title">Telegram</b><small class="sub">@msg_xyz_bio</small></span><span class="arrow">›</span>
    </a>
    <a class="link" href="https://www.youtube.com/@msg_xyz" target="_blank" rel="noopener">
      <span class="icon">▶</span><span class="txt"><b class="title">YouTube</b><small class="sub">@msg_xyz</small></span><span class="arrow">›</span>
    </a>
    <a class="link" href="https://funpay.com/users/15304290/" target="_blank" rel="noopener">
      <span class="icon">F</span><span class="txt"><b class="title">FunPay</b><small class="sub">werage1zxc / FunPay</small></span><span class="arrow">›</span>
    </a>
    <a class="link" href="https://github.com/msg-xyz" target="_blank" rel="noopener">
      <span class="icon">⌘</span><span class="txt"><b class="title">GitHub</b><small class="sub">msg-xyz / msg.xyz</small></span><span class="arrow">›</span>
    </a>
  </div>

  <div class="footer">© 2026 · made with ✦</div>
</section>
</main>

<div class="music">
 <div class="note">♫</div>
 <div class="track"><b>Uhh.....</b><small><span id="cur">0:00</span> / <span id="dur">0:00</span></small></div>
 <button class="play" id="play">▶</button>
 <div class="progress"><span id="bar"></span></div>
</div>
<audio id="audio" preload="auto" loop><source src="music.mp3" type="audio/mpeg"></audio>

<script>
const $=s=>document.querySelector(s),card=$('#card'),audio=$('#audio'),play=$('#play');
async function activateSite(){
  $('#enter').classList.add('hidden');
  try{ await audio.play(); play.textContent='Ⅱ'; }catch(e){}
  try{ document.getElementById('bgVideo').play(); }catch(e){}
}
$('#enter').addEventListener('pointerdown', activateSite, {once:true});
play.onclick=async()=>{if(audio.paused){try{await audio.play();play.textContent='Ⅱ'}catch(e){}}else{audio.pause();play.textContent='▶'}};
function fmt(x){return Number.isFinite(x)?Math.floor(x/60)+':'+String(Math.floor(x%60)).padStart(2,'0'):'0:00'}
audio.onloadedmetadata=()=>$('#dur').textContent=fmt(audio.duration);
audio.ontimeupdate=()=>{$('#cur').textContent=fmt(audio.currentTime);if(audio.duration)$('#bar').style.width=audio.currentTime/audio.duration*100+'%'};



let tx=0,ty=0,cx=0,cy=0;
function raf(){cx+=(tx-cx)*.07;cy+=(ty-cy)*.07;card.style.transform=`rotateX(${cx}deg) rotateY(${cy}deg)`;requestAnimationFrame(raf)}raf();
addEventListener('mousemove',e=>{
 if(innerWidth<=600)return;
 tx=(e.clientY/innerHeight-.5)*-6;ty=(e.clientX/innerWidth-.5)*6;
 $('#cursor').style.left=e.clientX+'px';$('#cursor').style.top=e.clientY+'px';
});
addEventListener('mouseleave',()=>{tx=ty=0});
$('#theme').onclick=()=>{alert('Сайт выполнен в чёрно-белой теме.');};
</script>
</body>
</html>
